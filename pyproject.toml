[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "roaring-trigram"
version = "0.1.0"
description = "Memory-mapped byte trigram candidate index"
readme = "README.md"
requires-python = ">=3.12"

[tool.maturin]
bindings = "pyo3"
module-name = "roaring_trigram"
profile = "release"