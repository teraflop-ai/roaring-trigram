[package]
name = "roaring_trigram"
version = "0.1.0"
edition = "2021"

[lib]
name = "roaring_trigram"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
roaring = { version = "0.11.3", features = ["serde"] }
postcard = { version = "1.1.3", features = ["use-std"] }

